name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Estilo, análisis estático y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock', '**/composer.json') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno (sin secretos)
        run: cp .env.example .env && php artisan key:generate

      - name: Estilo (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Análisis estático (PHPStan / Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pruebas unitarias (PHPUnit)
        run: vendor/bin/phpunit
