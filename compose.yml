# Levanta TODO el proyecto: MySQL, Redis, API (PHP-FPM + Nginx), worker de cola, scheduler (cron) y la SPA.
# Requiere que football-vue esté clonado en la carpeta hermana ../football-vue
name: football

x-php: &php
  image: football-laravel:dev
  # Los tres servicios PHP (app, queue, scheduler) comparten el mismo build
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  pull_policy: never
  volumes:
    - .:/var/www/html
  restart: unless-stopped

services:
  app:
    <<: *php
    environment:
      RUN_SETUP: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/storage/app/.setup-done"]
      interval: 5s
      timeout: 3s
      retries: 120

  # Worker: ejecuta los Jobs (importación de ligas, actualización de competiciones) respetando el límite de peticiones.
  queue:
    <<: *php
    command: php artisan queue:work redis --sleep=2 --timeout=90 --max-time=3600
    depends_on:
      app:
        condition: service_healthy

  # Cron: ejecuta el scheduler de Laravel (actualiza competiciones cada hora).
  scheduler:
    <<: *php
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-football}
      MYSQL_USER: ${DB_USERNAME:-football}
      MYSQL_PASSWORD: ${DB_PASSWORD:-football_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # SPA Vue (build de producción servido por Nginx) -> http://localhost:8080
  frontend:
    build:
      context: ../football-vue
      args:
        VITE_API_URL: ${FRONTEND_API_URL:-http://localhost:8000/api}
    ports:
      - "8080:80"
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
